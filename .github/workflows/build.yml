name: Build Android app

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      # The project is stored as project.zip in the repo; unpack it before building.
      - name: Unpack project
        run: unzip -o -q project.zip -d . && ls

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # The GitHub runner already has the Android SDK (ANDROID_HOME); Gradle fetches any missing platform.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # If the signing secrets are set, the release APK and the Play Store bundle (AAB) are signed.
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "Signing key found: release files will be signed."
          else
            echo "No signing key secret: only the debug APK can be installed."
          fi

      - name: Build APK and Play Store bundle
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease bundleRelease

      - name: Collect files
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/MultiBox-Sessions-debug-${GITHUB_RUN_NUMBER}.apk"
          if [ -n "$SIGNING_KEYSTORE_PATH" ]; then
            cp app/build/outputs/apk/release/app-release.apk "out/MultiBox-Sessions-${GITHUB_RUN_NUMBER}.apk"
            cp app/build/outputs/bundle/release/app-release.aab "out/MultiBox-Sessions-PlayStore-${GITHUB_RUN_NUMBER}.aab"
          fi
          ls -la out

      - name: Upload APK / AAB
        uses: actions/upload-artifact@v4
        with:
          name: MultiBox-Sessions-build-${{ github.run_number }}
          path: out/
